[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imc-prosperity-4-toolkit-writeup"
version = "0.1.0"
description = "Quantitative research and backtesting toolkit for IMC Prosperity 4"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "scipy>=1.13",
    "matplotlib>=3.9,<4.0",
    "pyyaml>=6.0",
    "jsonpickle>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[project.scripts]
prosperity-toolkit = "prosperity_toolkit.cli:main"
prosperity4 = "prosperity_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prosperity_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["prosperity_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
explicit_package_bases = true
