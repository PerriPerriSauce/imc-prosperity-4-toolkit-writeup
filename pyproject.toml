
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imc-prosperity-4-toolkit-writeup"
version = "0.1.0"
description = "Quantitative research and backtesting toolkit for IMC Prosperity 4"
requires-python = ">=3.11,<3.13"

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<4.0",
    "matplotlib>=3.9,<4.0"
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "scipy>=1.13"
]

[project.scripts]
prosperity4 = "prosperity4.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prosperity4"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["prosperity4"]
branch = true

[tool.coverage.report]
show_missing = true
