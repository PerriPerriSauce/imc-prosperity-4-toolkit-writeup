# Backtesting Replay Configuration

backtest:
  initial_cash: 0.0
  fill_model: "conservative"  # options: conservative, touch, queue_priority
  slippage_model: "zero"
  mark_to_market: "mid_price"  # options: mid_price, weighted_mid, liquidation

limits:
  enforce_starting_position_check: true
  cancel_all_on_limit_breach: true

output:
  export_equity_curve: true
  figures_dir: "reports/figures"
  tables_dir: "reports/tables"
