# Parameter Optimization Configuration

optimization:
  method: "grid_search"  # options: grid_search, random_search, bayesian
  objective: "sharpe_ratio"  # options: total_pnl, sharpe_ratio, sortino_ratio
  cv_folds: 5
  train_test_split_ratio: 0.7

validation:
  deflated_sharpe_correction: true
  pbo_cscv_partitions: 16
  min_trades_threshold: 50
